[package]
name = "Zephyr"
version = "1.2.0"
description = "A modern Mihomo GUI client"
license = "MIT"
authors = ["Zephyr Team"]
edition = "2021"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
devtools = ["tauri/devtools"]  # Only enable in development builds

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_clash_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zephyr-core = { path = "../../../crates/core", version = "0.1.0" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate", "blocking"] }
zip = "8.6"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
tempfile = "3"
rand = { version = "0.10.1", features = ["thread_rng", "alloc"] }
base64 = "0.22"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
regex = "1"
tokio = { version = "1", features = ["time", "test-util"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
aes-gcm = "0.11"
pbkdf2 = "0.12"
hmac = "0.12"
clash-prism-core = "0.1.5"
clash-prism-extension = { version = "0.1.9", features = ["watcher"] }
clash-prism-plugin = "0.1.1"
clash-prism-script = "0.1.3"
clash-prism-smart = "0.1.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
dashmap = "6.0"
minisign = "0.9"
arboard = "3.3"

[target.'cfg(unix)'.dependencies]
# Force upgrade glib to address known vulnerability (indirect dep via webkit2gtk/gtk on Linux/macOS)
glib = ">= 0.20, < 1"
# Already an indirect dep via tauri/gtk; used for prctl(PR_SET_PDEATHSIG) to
# ensure mihomo exits when the Tauri main process dies (even from SIGKILL).
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Registry",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_UI_Shell"
] }
winreg = "0.52"
# webview2-com: direct dependency for ProcessFailed crash recovery.
#
# PINNED to match the transitive dependency via tauri → wry → webview2-com.
# webview2-com 0.39.x upgraded its `windows` crate dep from 0.61 → 0.62, which
# is a breaking change — COM types from 0.39.x are incompatible with the 0.38.x
# types returned by wry's controller. This causes E0277 trait bound errors.
#
# Do NOT bump this beyond what tauri/wry uses. When upgrading tauri, check
# `cargo tree -i webview2-com` for the new version and update this pin to match.
# Dependabot bumps for this crate should be closed (add to .github/dependabot.yml
# ignore list if necessary).
webview2-com = "=0.38.2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific dependencies will be added as needed
# Currently using only std::process::Command for networksetup

[target.'cfg(target_os = "linux")'.dependencies]
# Enable Wayland clipboard support via wlr-data-control protocol
arboard = { version = "3.3", features = ["wayland-data-control"] }
# Linux specific dependencies will be added as needed
# Note: System proxy uses gsettings for GNOME and kwriteconfig5/6 for KDE

[dev-dependencies]
mockall = "0.15"
tempfile = "3.14"
insta = { version = "1", features = ["filters"] }

# 继承 workspace 根 Cargo.toml 的 [workspace.lints] 统一配置，
# 确保 desktop crate 与 core/core-ffi 使用同一套 lint 规则。
# desktop crate 在 src/lib.rs 顶部用 #![deny(clippy::needless_pass_by_value)]
# 覆盖 workspace 的 allow（FFI 库需要 allow，desktop 非 FFI 需要 deny）。
[lints]
workspace = true
