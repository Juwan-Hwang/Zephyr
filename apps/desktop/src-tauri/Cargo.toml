[package]
name = "Zephyr"
version = "1.2.0"
description = "A modern Mihomo GUI client"
license = "MIT"
authors = ["Zephyr Team"]
edition = "2021"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
devtools = ["tauri/devtools"]  # Only enable in development builds

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_clash_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate"] }
zip = "2.2"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
tempfile = "3"
rand = { version = "0.10.1", features = ["thread_rng", "alloc"] }
base64 = "0.22"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2"
regex = "1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
clash-prism-core = "0.1.4"
clash-prism-extension = { version = "0.1.7", features = ["watcher"] }
clash-prism-plugin = "0.1.1"
clash-prism-script = "0.1.1"
clash-prism-smart = "0.1.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
# Force upgrade glib to address known vulnerability (indirect dep via webkit2gtk/gtk on Linux/macOS)
glib = ">= 0.20, < 1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Registry",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_Shell"
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific dependencies will be added as needed
# Currently using only std::process::Command for networksetup

[target.'cfg(target_os = "linux")'.dependencies]
# Linux specific dependencies will be added as needed
# Note: System proxy uses gsettings for GNOME and kwriteconfig5/6 for KDE

[dev-dependencies]
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints]
# rustc native lints
[lints.rust]
unused_crate_dependencies = "allow"

[lints.clippy]

# =====================================================================
#  第一层：正确性 & 安全性（最高优先级，绝不允许通过）
# =====================================================================
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
panic = "deny"
unimplemented = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
map_err_ignore = "deny"

# =====================================================================
#  第二层：并发 & 内存安全
# =====================================================================
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
rc_clone_in_vec_init = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
await_holding_lock = "deny"
async_yields_async = "deny"
unused_async = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
large_const_arrays = "deny"

# =====================================================================
#  第三层：性能优化（内存分配）
# =====================================================================
string_add_assign = "deny"
format_in_format_args = "deny"
format_collect = "deny"
literal_string_with_formatting_args = "deny"
format_push_string = "deny"
vec_init_then_push = "deny"
useless_vec = "deny"
try_err = "deny"
repeat_once = "deny"
useless_asref = "deny"
needless_borrow = "deny"
needless_borrows_for_generic_args = "deny"
assigning_clones = "deny"
clone_on_copy = "deny"
redundant_clone = "deny"
option_as_ref_cloned = "deny"
unnecessary_box_returns = "deny"
vec_box = "deny"
large_enum_variant = "deny"
rc_buffer = "deny"
linkedlist = "deny"
unnecessary_to_owned = "deny"
str_to_string = "deny"

# =====================================================================
#  第四层：性能优化（CPU & 算法）
# =====================================================================
inefficient_to_string = "deny"
uninlined_format_args = "deny"
ptr_arg = "deny"
trivially_copy_pass_by_ref = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
manual_range_contains = "deny"
suspicious_xor_used_as_pow = "deny"
suboptimal_flops = "deny"
float_cmp = "deny"
float_equality_without_abs = "deny"
naive_bytecount = "deny"
chars_last_cmp = "deny"
# chars_cmp_with_unwrap removed: not available in Rust 1.94
single_char_pattern = "deny"
manual_str_repeat = "deny"
trivial_regex = "deny"
unnecessary_sort_by = "deny"
same_item_push = "deny"
single_element_loop = "deny"
manual_memcpy = "deny"
manual_is_ascii_check = "deny"
collapsible_str_replace = "deny"

# =====================================================================
#  第五层：性能优化（迭代器 & 闭包 & 循环）
# =====================================================================
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
iter_with_drain = "deny"
iter_on_single_items = "deny"
iter_on_empty_collections = "deny"
collection_is_never_read = "deny"
iter_cloned_collect = "deny"
option_filter_map = "deny"
filter_map_identity = "deny"
unnecessary_filter_map = "deny"
manual_filter_map = "deny"
search_is_some = "deny"
manual_find_map = "deny"
unnecessary_fold = "deny"
manual_flatten = "deny"
bind_instead_of_map = "deny"
filter_map_bool_then = "deny"
get_first = "deny"
iter_next_slice = "deny"
iter_nth_zero = "deny"
while_let_on_iterator = "deny"
needless_range_loop = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
manual_while_let_some = "deny"
needless_collect = "deny"
iter_over_hash_type = "deny"

# =====================================================================
#  第六层：性能优化（内存操作 & 数据结构）
# =====================================================================
mem_replace_with_default = "deny"
mem_replace_option_with_none = "deny"
clear_with_drain = "deny"
extend_with_drain = "deny"
drain_collect = "deny"
significant_drop_tightening = "deny"
significant_drop_in_scrutinee = "deny"
pathbuf_init_then_push = "deny"
let_underscore_lock = "deny"

# =====================================================================
#  第七层：性能优化（类型系统 & 编译）
# =====================================================================
expl_impl_clone_on_copy = "deny"
copy_iterator = "deny"
cloned_instead_of_copied = "deny"
borrow_deref_ref = "deny"
deref_addrof = "deny"
redundant_type_annotations = "deny"
from_over_into = "deny"
into_iter_on_ref = "deny"
derive_partial_eq_without_eq = "deny"
extra_unused_lifetimes = "deny"
extra_unused_type_parameters = "deny"
missing_const_for_fn = "deny"
inline_always = "deny"
# unused_crate_dependencies is a rustc lint, not clippy
multiple_crate_versions = "allow"

# =====================================================================
#  第八层：代码质量（冗余 & 可读性 & 风格）
# =====================================================================
redundant_else = "deny"
needless_continue = "deny"
needless_raw_string_hashes = "deny"
needless_pass_by_ref_mut = "deny"
or_fun_call = "deny"
useless_let_if_seq = "deny"
use_self = "deny"
tuple_array_conversions = "deny"
trait_duplication_in_bounds = "deny"
string_lit_as_bytes = "deny"
unnecessary_self_imports = "deny"
unused_trait_names = "deny"
wildcard_imports = "deny"
unnecessary_wraps = "deny"
cognitive_complexity = "deny"
suspicious_operation_groupings = "deny"
branches_sharing_code = "deny"
equatable_if_let = "deny"
nonminimal_bool = "deny"
overly_complex_bool_expr = "deny"
collapsible_if = "deny"
collapsible_match = "deny"
match_same_arms = "deny"
needless_match = "deny"
let_and_return = "deny"
needless_return = "deny"
semicolon_if_nothing_returned = "deny"
single_match_else = "deny"
if_then_some_else_none = "deny"
needless_bool_assign = "deny"
manual_assert = "deny"
ref_patterns = "deny"
default_trait_access = "deny"
filetype_is_file = "deny"
large_include_file = "deny"
shadow_reuse = "deny"
unnecessary_safety_comment = "deny"
doc_markdown = "deny"
explicit_deref_methods = "deny"
mod_module_files = "deny"
multiple_bound_locations = "deny"
stable_sort_primitive = "deny"
self_only_used_in_recursion = "deny"

# =====================================================================
#  第九层：正确性辅助（防止静默丢弃 & 潜在 bug）
# =====================================================================
must_use_candidate = "deny"
manual_ok_or = "deny"
option_map_or_none = "deny"
result_map_or_into_option = "deny"
wildcard_enum_match_arm = "deny"
used_underscore_binding = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
