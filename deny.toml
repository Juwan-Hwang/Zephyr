# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
ignore = [
  # rust-unic family — all pulled in by Tauri (tauri-utils → urlpattern → unic-ucd-ident → unic-ucd-*)
  # No safe upgrade available upstream, waiting for Tauri to update its urlpattern dependency
  # Advisory IDs RUSTSEC-2025-0075~0084 + 0098/0100 cover the entire unic crate ecosystem
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0082", reason = "unic-ucd-version, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0083", reason = "unic-ucd-ident, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0084", reason = "unic-segment, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, rust-unic family via Tauri, no safe upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, rust-unic family via Tauri, no safe upgrade" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "OpenSSL",
  "Zlib",
  "MPL-2.0",
  # Tauri / gtk-rs ecosystem
  "LGPL-3.0",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
