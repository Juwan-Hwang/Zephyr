# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
# cargo-deny does not support ignoreUntil/expiry fields (unlike osv-scanner.toml).
# Review-by dates below mirror the OSV ignoreUntil = 2027-12-31 for periodic
# re-evaluation.  Ignored advisories are fully suppressed from cargo-deny
# output — they are NOT surfaced as warnings.  See osv-scanner.toml for the
# time-bounded suppressions of the same advisory IDs.
# Review by: 2027-12-31
ignore = [
  "RUSTSEC-2026-0097",
  # gtk-rs GTK3 bindings — unmaintained; fix requires Tauri GTK4 migration
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # glib 0.18.x — unsound VariantStrIter (RUSTSEC-2024-0429)
  # Locked by gtk-rs GTK3; fix requires glib >=0.20.0 (GTK4 migration)
  "RUSTSEC-2024-0429",
  # Unmaintained-only advisories (bincode, proc-macro-error, paste, unic-*)
  # are NOT listed here — `unmaintained = "workspace"` below handles them:
  # transitive unmaintained deps are allowed (non-failing) automatically.
  # Keeping them in ignore would suppress even informational output.
  # They remain in .cargo/audit.toml & osv-scanner.toml (those tools lack
  # an unmaintained setting).
]
# RUSTSEC-2026-0097: rand 0.8 unsound with custom logger using rand::rng()
#   Indirect dependency via clash-prism-script v0.1.3 (latest, still uses rand 0.8)
#   Our code pins rand = "0.10.1" directly; fix requires clash-prism-script to upgrade rand
#   Track: https://rustsec.org/advisories/RUSTSEC-2026-0097.html
#
# RUSTSEC-2026-0098 / RUSTSEC-2026-0099: rustls-webpki name constraints — RESOLVED
#   Fixed by rustls-webpki 0.103.13 (>=0.103.12); waivers removed.
#
# RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml DoS vulnerabilities
#   FIXED: upgraded wayland-scanner 0.31.10 → 0.31.11 (quick-xml 0.39.4 → 0.41.0)
#
# RUSTSEC-2024-0411..0420, 0429: gtk-rs GTK3 / glib 0.18.x unmaintained
#   Indirect dep via Tauri's webkit2gtk on Linux; fix requires Tauri GTK4 migration
#
# Unmaintained-only advisories (bincode, proc-macro-error, paste, unic-*)
#   Handled by unmaintained = "workspace" below; NOT in ignore list.
#   Still tracked in .cargo/audit.toml & osv-scanner.toml (no unmaintained setting).
#
# RUSTSEC-2026-0185: quinn-proto remote memory exhaustion
#   Fixed by upgrading quinn-proto 0.11.14 → 0.11.16 (>=0.11.15)
#
# gtk-rs (0411-0420) and glib (0429) are intentionally suppressed from cargo-deny
# output.  They are visible only in this config file, not in tool reports.
# Re-evaluate by 2027-12-31 (aligned with osv-scanner.toml ignoreUntil dates).
# Only fail on actual security vulnerabilities, warn for unmaintained crates
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "OpenSSL",
  "Zlib",
  "MPL-2.0",
  # Tauri / gtk-rs ecosystem
  "LGPL-3.0",
  "0BSD",
  # notify (via clash-prism-core) — FSF-approved public-domain dedication
  "CC0-1.0",
  # libbz2-rs-sys (via zip v8 → bzip2 v0.6) — BSD-like, FSF-approved
  "bzip2-1.0.6",
  # clipboard-win (via arboard) — Boost Software License, BSD-like, FSF-approved
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
