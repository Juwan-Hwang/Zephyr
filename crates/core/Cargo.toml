[package]
name = "zephyr-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
uniffi    = { version = "0.28", optional = true }
thiserror = "1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
base64    = "0.22"
aes-gcm   = "0.10"
rand      = { version = "0.9", features = ["thread_rng"] }
uuid      = { version = "1", features = ["v4"] }
tokio     = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
url       = "2"
regex     = "1"
dashmap   = "6"
clash-prism-core  = "0.1.5"
clash-prism-smart = "0.1.1"

[features]
default = []
uniffi = ["dep:uniffi"]
tokio-async = ["tokio"]
