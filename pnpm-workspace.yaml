packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

overrides:
  vite: 8.1.6
  # CVE-2024-4068: brace-expansion ReDoS — fix not backported to 1.x/2.x.
  brace-expansion: 5.0.12
  # CVE-2024-37890: ws DoS via overly long headers.
  ws: 8.21.1
  # nanoid 5.x is ESM-only; postcss (and other CommonJS consumers) require
  # the 3.x line.  Pin to latest 3.x to get security patches without
  # breaking CJS compatibility.
  nanoid@3: 3.3.18
  # undici: CRLF injection (CVE-2026-15157), cookie injection (CVE-2026-16729),
  # cache poisoning (CVE-2026-13697, CVE-2026-14643), response desync
  # (CVE-2026-16728).  Transitive dep of @cyclonedx/cdxgen & cheerio.
  undici: 8.12.4
  # CVE-2026-69152: tar uncontrolled recursion DoS via long-path member selection.
  tar: 7.5.21
  # fast-uri: scheme spoofing, host confusion, path equivalence and scheme
  # injection in URI normalization.  Transitive dep of ajv (via cdxgen).
  fast-uri: 3.1.9
  # minimatch: DoS via globparts amplification; no fix on the 10.x line.
  # Transitive dep of eslint, glob and cdxgen.
  minimatch: 11.0.8
  # glob 13 is built against minimatch 10 and silently matches nothing with
  # minimatch 11 (style-dictionary then writes empty token files); glob 14
  # is the line built on minimatch 11.
  glob@13: 14.0.6
  # One copy of each Lezer core package: CodeMirror matches syntax-tree props
  # and highlight tags by identity, so a second copy bundled for
  # lang-yaml/lang-javascript breaks their folding and highlighting.
  '@lezer/common': 1.5.3
  '@lezer/highlight': 1.2.5
  '@lezer/lr': 1.4.11
