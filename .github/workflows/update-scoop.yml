name: Update Scoop Bucket

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-scoop:
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 for Windows portable zips
        id: compute
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          X64_ZIP_URL="https://github.com/Juwan-Hwang/Zephyr/releases/download/${TAG}/Zephyr_x64-portable.zip"
          ARM64_ZIP_URL="https://github.com/Juwan-Hwang/Zephyr/releases/download/${TAG}/Zephyr_arm64-portable.zip"

          curl -sL -o win_x64.zip "$X64_ZIP_URL"
          WIN_X64_SHA=$(sha256sum win_x64.zip | cut -d' ' -f1)

          curl -sL -o win_arm64.zip "$ARM64_ZIP_URL"
          WIN_ARM64_SHA=$(sha256sum win_arm64.zip | cut -d' ' -f1)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WIN_X64_SHA=$WIN_X64_SHA" >> "$GITHUB_ENV"
          echo "WIN_ARM64_SHA=$WIN_ARM64_SHA" >> "$GITHUB_ENV"

      - name: Push updated Manifest to scoop-bucket
        if: env.WIN_X64_SHA != ''
        env:
          SCOOP_TOKEN: ${{ secrets.GH_PAT || secrets.RELEASE_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${SCOOP_TOKEN}@github.com/Juwan-Hwang/scoop-bucket.git scoop-repo || exit 0
          cd scoop-repo
          mkdir -p bucket

          cat > bucket/zephyr.json << EOF
          {
            "version": "${VERSION}",
            "description": "Modern, lightweight Mihomo GUI client built with Rust and Tauri v2",
            "homepage": "https://github.com/Juwan-Hwang/Zephyr",
            "license": "MIT",
            "suggest": {
              "Microsoft Edge WebView2": "extras/webview2"
            },
            "architecture": {
              "64bit": {
                "url": "https://github.com/Juwan-Hwang/Zephyr/releases/download/v${VERSION}/Zephyr_x64-portable.zip",
                "hash": "${WIN_X64_SHA}"
              },
              "arm64": {
                "url": "https://github.com/Juwan-Hwang/Zephyr/releases/download/v${VERSION}/Zephyr_arm64-portable.zip",
                "hash": "${WIN_ARM64_SHA}"
              }
            },
            "bin": "Zephyr.exe",
            "shortcuts": [
              [
                "Zephyr.exe",
                "Zephyr"
              ]
            ],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/Juwan-Hwang/Zephyr/releases/download/v\\$version/Zephyr_x64-portable.zip"
                },
                "arm64": {
                  "url": "https://github.com/Juwan-Hwang/Zephyr/releases/download/v\\$version/Zephyr_arm64-portable.zip"
                }
              }
            }
          }
          EOF

          git config user.name "Juwan"
          git config user.email "juwan.hwang@proton.me"
          git add bucket/zephyr.json
          git diff --cached --quiet && exit 0
          git commit -m "zephyr: Update to version ${VERSION}"
          git push
