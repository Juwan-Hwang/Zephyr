name: Update Winget Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-winget:
    runs-on: windows-latest
    steps:
      - name: Checkout Zephyr
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Submit Winget Package Update
        uses: vedantmgoyal2009/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.GH_PAT || secrets.RELEASE_TOKEN }}
        with:
          identifier: Juwan.Zephyr
          version: ${{ steps.get_version.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN || secrets.GH_PAT || secrets.RELEASE_TOKEN }}
