name: Mobile Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Add Rust cross-compilation targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk & uniffi-bindgen
        run: |
          cargo install cargo-ndk
          # Install uniffi-bindgen from source (0.28.x has no standalone binary on crates.io)
          git clone --depth 1 --branch v0.28.3 https://github.com/mozilla/uniffi-rs.git /tmp/uniffi-src
          rm -f /tmp/uniffi-src/rust-toolchain.toml
          cargo install --path /tmp/uniffi-src/examples/app/uniffi-bindgen-cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts && pnpm rebuild esbuild @parcel/watcher

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/core -> ../../target"

      - name: Build Design Tokens
        run: pnpm exec style-dictionary build --config packages/tokens/config.js

      - name: Build Rust (host, for bindgen)
        working-directory: crates/core-ffi
        run: cargo build --release --locked

      - name: Build Rust (Android NDK)
        working-directory: crates/core-ffi
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../../android/app/src/main/jniLibs \
            build --release

      - name: Generate Kotlin bindings
        run: |
          uniffi-bindgen generate \
            --library target/release/libzephyr_core_ffi.so \
            --language kotlin \
            --out-dir android/app/build/generated/uniffi/

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: "Build iOS XCFramework"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Add Rust cross-compilation targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install uniffi-bindgen
        run: |
          git clone --depth 1 --branch v0.28.3 https://github.com/mozilla/uniffi-rs.git /tmp/uniffi-src
          rm -f /tmp/uniffi-src/rust-toolchain.toml
          cargo install --path /tmp/uniffi-src/examples/app/uniffi-bindgen-cli

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts && pnpm rebuild esbuild @parcel/watcher

      - name: Build Design Tokens
        run: pnpm exec style-dictionary build --config packages/tokens/config.js

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/core -> ../../target"

      - name: Build XCFramework
        working-directory: crates/core
        run: ./build_ios.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcframework
          path: ios/ZephyrCore.xcframework
