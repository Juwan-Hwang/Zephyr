# ============================================================
# Zephyr CI
# Fast feedback for pull requests and pushes to main:
# lint, typecheck and tests in the debug profile.
# All GitHub Actions are pinned to immutable commit SHAs
# (same pins as security.yml / release.yml).
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ============================================================
  # 前端：i18n 检查 + ESLint + typecheck + vitest
  # ============================================================
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for the Codecov upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        # --ignore-scripts + explicit rebuild of the allow-listed native deps,
        # matching security.yml.
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild @parcel/watcher

      - name: Check i18n completeness
        run: pnpm check:i18n

      - name: Lint JavaScript (ESLint)
        run: pnpm lint

      - name: TypeScript/JSDoc typecheck
        run: pnpm typecheck

      - name: Run frontend tests (with coverage)
        run: pnpm --filter @zephyr/desktop run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/desktop/coverage/lcov.info
          flags: frontend
          use_oidc: true

  # ============================================================
  # Third-party licenses: the shipped notices file must match the lockfiles
  # ============================================================
  licenses:
    name: Third-party licenses (up to date)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate third-party licenses and fail on drift
        run: |
          ./scripts/generate-licenses.sh
          if ! git diff --exit-code -- apps/desktop/src-tauri/THIRD-PARTY-LICENSES.txt; then
            echo "::error::THIRD-PARTY-LICENSES.txt is out of date. Run scripts/generate-licenses.sh and commit the result."
            exit 1
          fi

  # ============================================================
  # Rust (Linux)：fmt + clippy + debug 测试
  # ============================================================
  rust-linux:
    name: Rust (ubuntu, fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC token for the Codecov upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.96.0"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Commands run from the repo root, so cache the workspace-root target dir.
          workspaces: . -> target

      - name: Install system dependencies
        run: |
          success=0
          for i in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils; then
              success=1
              break
            elif [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Failed to install system dependencies after 3 attempts"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Lint rules live in [workspace.lints] in the root Cargo.toml.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests (debug, with coverage)
        # cargo-llvm-cov runs the same test suite under coverage
        # instrumentation and writes an lcov report for Codecov.
        # insta defaults to INSTA_UPDATE=no on CI, so missing or outdated
        # snapshots fail the run.
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          use_oidc: true

  # ============================================================
  # Rust (Windows / macOS)：debug 测试
  # 覆盖 #[cfg(target_os = ...)] 平台专属代码的编译与测试。
  # ============================================================
  rust-platform:
    name: Rust (${{ matrix.os }}, test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Run Rust tests (debug)
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      # Windows: the desktop crate's lib test binary links Tauri/WebView2 but
      # does not get the app manifest (Common Controls v6) that tauri-build
      # embeds only into the app binary, so it aborts at load time with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) before any test runs.
      # Until build.rs embeds the manifest for test targets too, run every
      # other workspace member's tests and only compile the desktop crate's
      # tests (which still catches Windows-only compile errors).
      - name: Run Rust tests (debug, excluding desktop crate)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude Zephyr --locked
      - name: Build desktop crate tests without running (debug)
        if: runner.os == 'Windows'
        run: cargo test -p Zephyr --no-run --locked
