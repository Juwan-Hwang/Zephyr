name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            arch: "arm64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            arch: "x64"
          - platform: "ubuntu-22.04"
            args: ""
            target: ""
            arch: "x64"
          - platform: "windows-latest"
            args: ""
            target: ""
            arch: "x64"

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update version in config files
        run: |
          set -e
          VERSION=${{ steps.get_version.outputs.VERSION }}

          echo "Before update:"
          nl -ba apps/desktop/src-tauri/tauri.conf.json | sed -n '1,80p'

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" apps/desktop/src-tauri/tauri.conf.json

          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
          rm -f apps/desktop/src-tauri/Cargo.toml.bak

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' apps/desktop/package.json > "$tmp"
          mv "$tmp" apps/desktop/package.json

          echo "After update:"
          nl -ba apps/desktop/src-tauri/tauri.conf.json | sed -n '1,80p'

          echo "Validate JSON:"
          jq empty apps/desktop/src-tauri/tauri.conf.json
          jq empty apps/desktop/package.json

          echo "Updated version to $VERSION"
        shell: bash

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config glib
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          if [ "${{ matrix.target }}" == "aarch64-apple-darwin" ]; then
            SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
            echo "PKG_CONFIG_SYSROOT_DIR=${SDK_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Install frontend dependencies
        run: pnpm install

      # Get latest mihomo release version
      - name: Get latest mihomo version
        id: mihomo_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIHOMO_VERSION=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$MIHOMO_VERSION" >> $GITHUB_OUTPUT
          echo "Latest mihomo version: $MIHOMO_VERSION"
        shell: bash

      - name: Download mihomo core (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p apps/desktop/src-tauri/bundled
          MIHOMO_VERSION=${{ steps.mihomo_version.outputs.VERSION }}
          
          curl -L -o mihomo.zip "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-windows-amd64-compatible-${MIHOMO_VERSION}.zip"
          
          ASSET_DIGEST=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            | jq -r '.assets[] | select(.name == "mihomo-windows-amd64-compatible-'${MIHOMO_VERSION}'.zip") | .digest // empty')
          
          if [ -n "$ASSET_DIGEST" ]; then
            EXPECTED_HASH=$(echo "$ASSET_DIGEST" | sed 's/sha256://')
            ACTUAL_HASH=$(sha256sum mihomo.zip | awk '{print $1}')
            
            if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
              echo "ERROR: SHA256 mismatch!"
              echo "Expected: $EXPECTED_HASH"
              echo "Actual: $ACTUAL_HASH"
              exit 1
            fi
            echo "✓ SHA256 verified for mihomo-windows-amd64-compatible"
          else
            echo "ERROR: SHA256 digest not available from GitHub API"
            exit 1
          fi
          
          unzip mihomo.zip
          mv mihomo-windows-amd64-compatible.exe apps/desktop/src-tauri/bundled/mihomo.exe
          rm mihomo.zip
        shell: bash

      - name: Download mihomo core (macOS arm64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'arm64'
        run: |
          mkdir -p apps/desktop/src-tauri/bundled
          MIHOMO_VERSION=${{ steps.mihomo_version.outputs.VERSION }}
          
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-darwin-arm64-${MIHOMO_VERSION}.gz"
          
          ASSET_DIGEST=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            | jq -r '.assets[] | select(.name == "mihomo-darwin-arm64-'${MIHOMO_VERSION}'.gz") | .digest // empty')
          
          if [ -n "$ASSET_DIGEST" ]; then
            EXPECTED_HASH=$(echo "$ASSET_DIGEST" | sed 's/sha256://')
            ACTUAL_HASH=$(sha256sum mihomo.gz | awk '{print $1}')
            
            if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
              echo "ERROR: SHA256 mismatch!"
              echo "Expected: $EXPECTED_HASH"
              echo "Actual: $ACTUAL_HASH"
              exit 1
            fi
            echo "✓ SHA256 verified for mihomo-darwin-arm64"
          else
            echo "ERROR: SHA256 digest not available from GitHub API"
            exit 1
          fi
          
          gunzip mihomo.gz
          chmod +x mihomo
          mv mihomo apps/desktop/src-tauri/bundled/mihomo
        shell: bash

      - name: Download mihomo core (macOS x64)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'x64'
        run: |
          mkdir -p apps/desktop/src-tauri/bundled
          MIHOMO_VERSION=${{ steps.mihomo_version.outputs.VERSION }}
          
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-darwin-amd64-compatible-${MIHOMO_VERSION}.gz"
          
          ASSET_DIGEST=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            | jq -r '.assets[] | select(.name == "mihomo-darwin-amd64-compatible-'${MIHOMO_VERSION}'.gz") | .digest // empty')
          
          if [ -n "$ASSET_DIGEST" ]; then
            EXPECTED_HASH=$(echo "$ASSET_DIGEST" | sed 's/sha256://')
            ACTUAL_HASH=$(sha256sum mihomo.gz | awk '{print $1}')
            
            if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
              echo "ERROR: SHA256 mismatch!"
              echo "Expected: $EXPECTED_HASH"
              echo "Actual: $ACTUAL_HASH"
              exit 1
            fi
            echo "✓ SHA256 verified for mihomo-darwin-amd64-compatible"
          else
            echo "ERROR: SHA256 digest not available from GitHub API"
            exit 1
          fi
          
          gunzip mihomo.gz
          chmod +x mihomo
          mv mihomo apps/desktop/src-tauri/bundled/mihomo
        shell: bash

      - name: Download mihomo core (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p apps/desktop/src-tauri/bundled
          MIHOMO_VERSION=${{ steps.mihomo_version.outputs.VERSION }}
          
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          
          ASSET_DIGEST=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            | jq -r '.assets[] | select(.name == "mihomo-linux-amd64-compatible-'${MIHOMO_VERSION}'.gz") | .digest // empty')
          
          if [ -n "$ASSET_DIGEST" ]; then
            EXPECTED_HASH=$(echo "$ASSET_DIGEST" | sed 's/sha256://')
            ACTUAL_HASH=$(sha256sum mihomo.gz | awk '{print $1}')
            
            if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
              echo "ERROR: SHA256 mismatch!"
              echo "Expected: $EXPECTED_HASH"
              echo "Actual: $ACTUAL_HASH"
              exit 1
            fi
            echo "✓ SHA256 verified for mihomo-linux-amd64-compatible"
          else
            echo "ERROR: SHA256 digest not available from GitHub API"
            exit 1
          fi
          
          gunzip mihomo.gz
          chmod +x mihomo
          mv mihomo apps/desktop/src-tauri/bundled/mihomo
        shell: bash

      - name: Download geo data files
        run: |
          mkdir -p apps/desktop/src-tauri/bundled
          
          curl -L -o apps/desktop/src-tauri/bundled/geoip.dat "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat"
          curl -L -o apps/desktop/src-tauri/bundled/geoip.dat.sha256sum "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat.sha256sum"
          curl -L -o apps/desktop/src-tauri/bundled/geosite.dat "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -L -o apps/desktop/src-tauri/bundled/geosite.dat.sha256sum "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat.sha256sum"
          curl -L -o apps/desktop/src-tauri/bundled/Country.mmdb "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          curl -L -o apps/desktop/src-tauri/bundled/Country.mmdb.sha256sum "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb.sha256sum"
          
          for file in geoip.dat geosite.dat Country.mmdb; do
            EXPECTED=$(cat "apps/desktop/src-tauri/bundled/$file.sha256sum" | cut -d' ' -f1)
            ACTUAL=$(sha256sum "apps/desktop/src-tauri/bundled/$file" | cut -d' ' -f1)
            
            if [ -z "$EXPECTED" ]; then
              echo "ERROR: Could not read SHA256 checksum for $file"
              exit 1
            fi
            
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "ERROR: SHA256 mismatch for $file!"
              echo "Expected: $EXPECTED"
              echo "Actual: $ACTUAL"
              exit 1
            fi
            echo "✓ SHA256 verified for $file"
            
            rm "apps/desktop/src-tauri/bundled/$file.sha256sum"
          done
        shell: bash

      - name: Create artifacts directory
        run: mkdir -p dist-artifacts
        shell: bash

      - name: Build Tauri app (Full)
        run: pnpm --filter @zephyr/desktop tauri build ${{ matrix.args }}

      - name: Collect Windows Full artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "dist-artifacts/$(basename "${f/-setup/-setup-full}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "dist-artifacts/$(basename "${f/.msi/-full.msi}")"
          done
        shell: bash

      - name: Collect macOS Full artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            cp "$f" "dist-artifacts/$(basename "${f/.dmg/-full.dmg}")"
          done
          for f in apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz; do
            cp "$f" "dist-artifacts/$(basename "${f/.tar.gz/-full.tar.gz}")"
          done
        shell: bash

      - name: Collect Linux Full artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "dist-artifacts/$(basename "${f/.deb/-full.deb}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "dist-artifacts/$(basename "${f/.AppImage/-full.AppImage}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm; do
            cp "$f" "dist-artifacts/$(basename "${f/.rpm/-full.rpm}")"
          done
        shell: bash

      - name: Remove bundled files for lite version
        run: |
          rm -rf apps/desktop/src-tauri/bundled/*
        shell: bash

      - name: Build Tauri app (Lite)
        run: pnpm --filter @zephyr/desktop tauri build ${{ matrix.args }}

      - name: Collect Windows Lite artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "dist-artifacts/$(basename "${f/-setup/-setup-lite}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "dist-artifacts/$(basename "${f/.msi/-lite.msi}")"
          done
        shell: bash

      - name: Collect macOS Lite artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            cp "$f" "dist-artifacts/$(basename "${f/.dmg/-lite.dmg}")"
          done
          for f in apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz; do
            cp "$f" "dist-artifacts/$(basename "${f/.tar.gz/-lite.tar.gz}")"
          done
        shell: bash

      - name: Collect Linux Lite artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "dist-artifacts/$(basename "${f/.deb/-lite.deb}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "dist-artifacts/$(basename "${f/.AppImage/-lite.AppImage}")"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm; do
            cp "$f" "dist-artifacts/$(basename "${f/.rpm/-lite.rpm}")"
          done
        shell: bash

      - name: Upload All Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Zephyr ${{ github.ref_name }}"
          body: "See the assets to download and install this version."
          draft: true
          prerelease: false
          files: dist-artifacts/*
