# ============================================================
# Zephyr Security Scan Pipeline
# All GitHub Actions are pinned to immutable commit SHAs.
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Rust 依赖漏洞扫描
  # ============================================================
  rust-dependency-audit:
    name: "\U0001F50D Rust Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
      - name: Run cargo audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ============================================================
  # Job 2: cargo-deny 许可证/重复crate/来源检查
  # ============================================================
  cargo-deny:
    name: "\U0001F6E1\uFE0F Cargo Deny Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check
          log-level: warn

  # ============================================================
  # Job 3: Rust 代码质量与安全检查 (clippy)
  # ============================================================
  rust-clippy:
    name: "\U0001F980 Rust Clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run clippy with security lints
        # Lint 规则统一由 workspace 根 Cargo.toml 的 [workspace.lints] 定义，
        # 本地与 CI 使用完全相同的规则集，命令行只需 -D warnings。
        run: cargo clippy --all-targets -- -D warnings

  # ============================================================
  # Job 4: Rust 格式化检查
  # ============================================================
  rust-fmt:
    name: "\U0001F4DD Rust Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

  # ============================================================
  # Job 5: 前端依赖漏洞扫描
  # ============================================================
  frontend-audit:
    name: "\U0001F4E6 Frontend Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Frontend dependency audit (GitHub advisory database)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog

  # ============================================================
  # Job 6: PR 依赖审查（仅 PR 触发）
  # ============================================================
  dependency-review:
    name: "\U0001F4E5 Dependency Review"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
          fail-on-severity: high

  # ============================================================
  # Job 7: Semgrep SAST（开源模式，无需 token）
  # ============================================================
  semgrep:
    name: "\U0001F50E Semgrep SAST Scan"
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.170.0

      - name: Semgrep scan (open source + custom rules)
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --sarif \
            --output semgrep.sarif \
            --severity WARNING \
            --error
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # Job 8: 密钥与敏感信息泄露检测
  # ============================================================
  secret-scan:
    name: "\U0001F511 Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified
          path: .

      - name: Check for hardcoded secrets in source
        run: |
          echo "=== Checking for hardcoded secrets ==="
          FAILED=0

          # Rust: 硬编码密码/凭证
          if grep -rnE '(password|passwd|pwd|secret)\s*[:=]\s*["\x27][^"\x27]{8,}' apps/desktop/src-tauri/src/ --include="*.rs" --exclude-dir=target \
             | grep -v 'test\|example\|placeholder\|TODO\|FIXME'; then
            echo "::error::Found hardcoded password or secret in Rust code"
            FAILED=1
          fi

          # Rust: 硬编码 API key / token
          if grep -rnE '(api_key|apikey|secret_key|private_key|access_token)\s*=\s*"[^"]{20,}"' apps/desktop/src-tauri/src/ --include="*.rs" --exclude-dir=target \
             | grep -v 'test\|example'; then
            echo "::error::Found hardcoded API key in Rust code"
            FAILED=1
          fi

          # Rust: 从环境变量读取密码（警告级别）
          if grep -rn 'env::var("PASSWORD")' apps/desktop/src-tauri/src/ --include="*.rs" --exclude-dir=target; then
            echo "::warning::Password read from environment variable (ensure not logged)"
          fi

          # JS: 硬编码 token / auth
          if grep -rnE '(token|auth|bearer|api_key)\s*[:=]\s*["\x27][^"\x27 ]{20,}' apps/desktop/src/ --include="*.js" \
             | grep -v 'test\|example\|placeholder\|localhost\|127\.0\.0\.1'; then
            echo "::error::Found hardcoded token in JS code"
            FAILED=1
          fi

          for pattern in "*.env" "*.env.*" "*.pem" "*.key" "*.p12" "*.pfx" "id_rsa*" "id_ed25519*" "*.keystore"; do
            if ! grep -qF "$pattern" .gitignore 2>/dev/null; then
              echo "::warning::.gitignore missing pattern: $pattern"
            fi
          done

          if [ $FAILED -eq 0 ]; then
            echo "\u2705 No hardcoded secrets detected"
          else
            exit 1
          fi

  # ============================================================
  # Job 9: OSSF Scorecard (comprehensive supply-chain security)
  # ============================================================
  scorecard:
    name: OSSF Scorecard (supply-chain health check)
    runs-on: ubuntu-latest
    # secrets.write 表示 actions/checkout@v4 将会在 step 内设置 git 认证信息（access token）。
    # 当仓库中含有 public submodule 时，Scorecard 使用 git clone 调用它们时就会失败。
    # Scorecard 从 workflow 内拷贝 token 到自身操作（git_clone_manager.go） 内。
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard Analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false # Free tier 只有 30 天存储；我们只要 artifact。

      - name: Upload Scorecard SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: scorecard.sarif

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 90

  # ============================================================
  # Job 10: Tauri 安全配置审计
  # ============================================================
  tauri-security:
    name: "\U0001F6E1\uFE0F Tauri Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Tauri security configuration
        run: |
          echo "=== Tauri Security Configuration Audit ==="
          WARNINGS=0

          if grep -q '"devtools": true' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::warning::devtools is enabled in production build. Set to false or use cfg!"
            WARNINGS=$((WARNINGS + 1))
          else
            echo "\u2705 devtools is disabled in production"
          fi

          if grep -q 'ws://127.0.0.1:\*' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::warning::CSP allows wildcard WebSocket ports. Restrict to specific ports."
            WARNINGS=$((WARNINGS + 1))
          fi

          if grep -q '"withGlobalTauri": true' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::warning::withGlobalTauri is enabled. Consider disabling."
            WARNINGS=$((WARNINGS + 1))
          fi

          # 检查 capabilities 权限（Tauri v2 风格）
          if [ -d "apps/desktop/src-tauri/capabilities" ]; then
            echo "=== Checking capabilities ==="
            for cap_file in apps/desktop/src-tauri/capabilities/*.json; do
              if [ -f "$cap_file" ]; then
                if grep -q '"windows"' "$cap_file" 2>/dev/null && ! grep -q '"label"' "$cap_file" 2>/dev/null; then
                  echo "::warning::$cap_file: window permission without label filter"
                  WARNINGS=$((WARNINGS + 1))
                fi
                if grep -q 'allow-emit' "$cap_file" 2>/dev/null; then
                  echo "::warning::$cap_file: core:event:allow-emit is granted. Evaluate if needed."
                  WARNINGS=$((WARNINGS + 1))
                fi
              fi
            done
            echo "\u2705 Capabilities checked"
          fi

          if [ ! -f "apps/desktop/src-tauri/Cargo.lock" ]; then
            echo "::warning::Cargo.lock not found. Commit it for reproducible builds."
            WARNINGS=$((WARNINGS + 1))
          else
            echo "\u2705 Cargo.lock exists"
          fi

          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "::error::pnpm-lock.yaml not found. Run pnpm install and commit it."
            exit 1
          else
            echo "\u2705 pnpm-lock.yaml exists"
          fi

          if [ $WARNINGS -gt 0 ]; then
            echo "::notice::$WARNINGS warning(s) found. Review above."
          fi
          echo "\u2705 Tauri security audit completed"

  # ============================================================
  # Job 10: 构建验证 + 测试
  # ============================================================
  build-verification:
    name: "\U0001F528 Build Verification"
    runs-on: ubuntu-latest
    needs: [rust-clippy, rust-fmt]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Cache the workspace-root target directory, since `cargo test --workspace`
          # runs from the repo root and compiles all workspace members.
          workspaces: . -> target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts && pnpm rebuild esbuild @parcel/watcher

      - name: Check i18n completeness
        run: pnpm check:i18n

      - name: Lint JavaScript (ESLint)
        run: pnpm --filter @zephyr/desktop lint

      - name: TypeScript/JSDoc typecheck
        run: pnpm --filter @zephyr/desktop typecheck

      - name: Build CSS
        run: pnpm --filter @zephyr/desktop build:css

      - name: Build Rust (release)
        # Build workspace members except core-ffi (no tests, needs uniffi-bindgen).
        run: cargo build --workspace --exclude zephyr-core-ffi --release --locked

      - name: Run Rust tests and verify Golden snapshots
        run: |
          set -euo pipefail
          # Generate/update snapshots and run all workspace tests.
          # INSTA_UPDATE=always updates .snap files to match current output;
          # any resulting diff means snapshots need to be committed.
          # NOTE: Snapshot test inputs MUST be deterministic (no timestamps,
          # random values, or environment-dependent strings). Non-deterministic
          # outputs will cause this check to fail on every run.
          # Exclude zephyr-core-ffi: it has no tests and requires uniffi-bindgen
          # to generate FFI bindings, which adds unnecessary CI time.
          INSTA_UPDATE=always cargo test --workspace --exclude zephyr-core-ffi --release --locked 2>&1 | tee /tmp/cargo-test.log
          # Fail if any .snap files are modified (tracked) or untracked.
          if ! git diff --exit-code -- '*.snap' || git ls-files --others --exclude-standard -- '*.snap' | grep -q .; then
            echo "::error::Golden test snapshots are missing or outdated."
            echo "::error::The following .snap files need to be committed:"
            git diff --name-only -- '*.snap'
            git ls-files --others --exclude-standard -- '*.snap'
            exit 1
          fi
          echo "All snapshot files are committed and up to date."
          # Fail if Cargo.lock was modified by the build/test steps.
          if ! git diff --exit-code -- Cargo.lock; then
            echo "::error::Cargo.lock was modified. Please commit the updated lockfile."
            exit 1
          fi
          echo "Cargo.lock is up to date."

      - name: Run frontend tests
        run: pnpm --filter @zephyr/desktop test

  # ============================================================
  # Job 11: macOS 编译检查（原生 macOS runner，支持 ObjC 交叉编译）
  # ============================================================
  macos-build-check:
    name: "\U0001F34E macOS Build Check"
    runs-on: macos-latest
    needs: [rust-clippy, rust-fmt]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
      - name: Add Rust cross-compilation targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install macOS dependencies
        run: brew install pkg-config glib
      - name: Configure pkg-config for cross-compilation
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          echo "PKG_CONFIG_SYSROOT_DIR=${SDK_PATH}" >> "$GITHUB_ENV"
      - name: Check x86_64-apple-darwin
        working-directory: apps/desktop/src-tauri
        run: cargo check --target x86_64-apple-darwin
      - name: Check aarch64-apple-darwin
        working-directory: apps/desktop/src-tauri
        run: cargo check --target aarch64-apple-darwin

  # ============================================================
  # Job 12: Windows 编译检查（原生 Windows runner，编译 Windows 专属代码）
  # ============================================================
  # webview2-com、webview_recovery.rs 等 #[cfg(target_os = "windows")] 代码
  # 在 Ubuntu CI 上完全不参与编译，导致 Windows 专属的编译错误无法被发现。
  # 此 job 确保所有 Windows 平台条件编译的代码也能通过编译。
  windows-build-check:
    name: "Windows Build Check"
    runs-on: windows-latest
    needs: [rust-clippy, rust-fmt]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Check x86_64-pc-windows-msvc
        working-directory: apps/desktop/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

  # ============================================================
  # Job 13: SBOM 生成（CycloneDX — Rust + NPM）
  # ============================================================
  # 为每次 push/PR 生成完整的软件物料清单，覆盖 Rust (Cargo) 和
  # NPM (pnpm) 两套依赖树。产物上传为 artifact 供安全审计使用。
  sbom:
    name: "\U0001F4CB SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ── Rust SBOM ──
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate Rust SBOM
        # 从 workspace 根目录运行，覆盖所有 crate 成员
        run: cargo cyclonedx --all --format json --spec-version 1.5
      - name: Collect Rust SBOM files
        run: |
          mkdir -p sbom/rust sbom/npm
          # Use unique names to avoid collision: prefix with crate name if available.
          while IFS= read -r -d '' f; do
            name=$(basename "$f" .cdx.json)
            # Try to extract crate name from path.
            parent=$(basename "$(dirname "$f")")
            if [ "$name" != "$parent" ]; then
              cp "$f" "sbom/rust/${parent}-${name}.cdx.json"
            else
              cp "$f" "sbom/rust/${name}.cdx.json"
            fi
          done < <(find . -name '*.cdx.json' -not -path './sbom/*' -not -path './node_modules/*' -print0)
          ls -la sbom/rust/ sbom/npm/ || echo "No NPM SBOM yet"

      # ── NPM SBOM ──
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies for SBOM
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate NPM SBOM
        # cyclonedx-npm internally runs `npm ls` which is incompatible with
        # pnpm's node_modules layout.  cdxgen natively supports pnpm.
        # --ignore-scripts prevents lifecycle script execution (SonarCloud S6724).
        run: |
          npx --yes --ignore-scripts --package=@cyclonedx/cdxgen@12.8.0 cdxgen -t pnpm --spec-version 1.5 -o sbom/npm/npm.cdx.json
      - name: Verify NPM SBOM
        run: |
          if [ ! -f sbom/npm/npm.cdx.json ]; then
            echo "::error::cdxgen did not produce sbom/npm/npm.cdx.json"
            exit 1
          fi
          echo "NPM SBOM generated: $(wc -c < sbom/npm/npm.cdx.json) bytes"
      - name: Merge SBOMs
        # 合并 Rust 和 NPM 的 SBOM 为统一文件（公共脚本，与 release.yml 共用）
        run: python3 scripts/merge-sboms.py --output sbom/bom.cdx.json

      # ── Upload ──
      # GitHub Free tier: artifact 最多保留 90 天。
      # Release tag 时额外将 SBOM 附带到 Release Assets（永久保存）。
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom/bom.cdx.json
            sbom/rust/*.cdx.json
            sbom/npm/*.cdx.json
          retention-days: 90
