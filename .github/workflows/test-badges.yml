name: Test Badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # === Rust Tests ===
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Count Rust tests
        id: rust
        working-directory: apps/desktop/src-tauri
        run: |
          COUNT=$(cargo test -- --list 2>&1 | grep -cE '\btest\b$')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # === JS Tests ===
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Count JS tests
        id: js
        run: |
          pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild @parcel/watcher
          cd apps/desktop
          COUNT=$(pnpm vitest run --reporter=verbose 2>&1 | grep -oP '\d+(?=\s+passed)' | tail -1)
          if [ -z "$COUNT" ]; then
            COUNT=$(grep -rP '^\s*(it|test)\(' src --include="*.test.js" | wc -l)
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # === Update Gist Badges ===
      - name: Update Rust badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: rust-tests.json
          label: Rust Tests
          message: ${{ steps.rust.outputs.count }}
          color: green

      - name: Update JS badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: js-tests.json
          label: JS Tests
          message: ${{ steps.js.outputs.count }}
          color: brightgreen
