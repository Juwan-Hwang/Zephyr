# Zephyr Custom Semgrep Rules
# All patterns use valid Semgrep syntax (verified)
rules:
  # ============================================================
  # Rust Rules
  # ============================================================

  # NOTE: rust-osascript-* and rust-command-format-arg rules removed.
  # pattern-regex was too broad (matched comments + string literals), and
  # // nosemgrep comments could not suppress findings in GitHub SARIF output.
  # All osascript usages are intentional (macOS TUN mode) with proper escaping.
  # format!() args passed via .arg() are safe (no shell interpolation).
  # Rust clippy security lints provide better, AST-level coverage.

  - id: rust-unsafe-block
    languages: [rust]
    message: |
      Unsafe block detected. Review for memory safety issues.
      Ensure all unsafe operations have safety documentation comments.
    severity: INFO
    pattern: |
      unsafe { ... }
    paths:
      exclude:
        - "**/tests/**"
        - "**/*_test.rs"
        - "**/examples/**"
    metadata:
      category: security
      cwe: "CWE-119"
      confidence: LOW

  - id: rust-hardcoded-crypto-constant
    languages: [rust]
    message: |
      Possible hardcoded cryptographic key or secret in a named constant.
      The variable name suggests this may be a sensitive value.
      Use environment variables or secure key derivation instead.
    severity: WARNING
    patterns:
      - pattern: |
          const $KEY: &str = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)(key|secret|token|password|credential|api_key|private)'
    paths:
      exclude:
        - "**/tests/**"
        - "**/*_test.rs"
        - "**/examples/**"
        - "**/benches/**"
    metadata:
      category: security
      cwe: "CWE-321"
      confidence: MEDIUM

  # ============================================================
  # JavaScript / TypeScript Rules
  # ============================================================

  # NOTE: js-innerhtml-assignment rule removed — eslint no-unsanitized/property
  # already covers this with higher accuracy (recognizes escapeHtml/sanitizeHtml
  # safe patterns). The Semgrep rule produced excessive false positives that
  # // nosemgrep comments could not suppress in GitHub Code Scanning SARIF output.

  - id: js-insertadjacenthtml
    languages: [javascript, typescript]
    message: |
      insertAdjacentHTML detected. Verify that the HTML content is
      developer-controlled and not derived from user input.
      Consider using DOMPurify.sanitize() for defense in depth.
    severity: INFO
    pattern: |
      $OBJ.insertAdjacentHTML($POS, $HTML)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/node_modules/**"
    metadata:
      category: security
      cwe: "CWE-79"
      confidence: LOW

  - id: js-document-write
    languages: [javascript, typescript]
    message: |
      document.write() detected. This can lead to XSS if the argument
      contains user-controlled data. Avoid using document.write().
    severity: WARNING
    pattern-regex: 'document\.write\('
    paths:
      exclude:
        - "**/test/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/node_modules/**"
    metadata:
      category: security
      cwe: "CWE-79"
      confidence: MEDIUM
