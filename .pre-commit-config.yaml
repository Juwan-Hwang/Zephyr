# pre-commit hooks: fast file-hygiene checks only.
# The same hooks run in the cloud via pre-commit.ci, which pushes
# autofix commits to PRs. Hook version updates come from Renovate.
# Rust/JS formatting and lint stay in CI (cargo fmt/clippy, ESLint),
# so they are deliberately not duplicated here.
# Docs: https://pre-commit.com and https://pre-commit.ci
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # THIRD-PARTY-LICENSES.txt is generated verbatim from upstream
      # license files (scripts/generate-licenses.sh); trimming it here
      # would make it differ from the generator output that CI checks.
      - id: trailing-whitespace
        exclude: '\.(snap|md)$|THIRD-PARTY-LICENSES\.txt$'
      - id: end-of-file-fixer
        exclude: '\.snap$|THIRD-PARTY-LICENSES\.txt$'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # The generated license file is ~670 KB of verbatim upstream
      # license texts; it cannot fit the 500 KB default limit.
      - id: check-added-large-files
        exclude: 'THIRD-PARTY-LICENSES\.txt$'

ci:
  autofix_prs: true
  # pre-commit.ci autoupdate cannot be switched off here (weekly is the
  # default when this line is omitted), so use its slowest schedule and
  # let Renovate handle the routine hook updates.
  autoupdate_schedule: quarterly
