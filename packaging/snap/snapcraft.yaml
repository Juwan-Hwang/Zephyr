name: zephyr
base: core22
version: '2.4.3'
summary: Modern, lightweight Mihomo GUI client
description: |
  Zephyr is a state-of-the-art cross-platform GUI client for Mihomo, combining modern desktop aesthetics, high performance with Rust and Tauri v2, and a 13-layer security defense architecture.

grade: stable
confinement: strict

apps:
  zephyr:
    command: usr/bin/Zephyr
    desktop: usr/share/applications/Zephyr.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - unity7
      - opengl
      - audio-playback

parts:
  zephyr:
    plugin: dump
    source: https://github.com/Juwan-Hwang/Zephyr/releases/download/v2.4.3/Zephyr_2.4.3_amd64-full.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libsoup-3.0-0
