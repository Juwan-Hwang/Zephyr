[workspace]
members = ["apps/desktop/src-tauri", "core", "core/ffi/uniffi"]
resolver = "2"

# 性能优先（默认）
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
split-debuginfo = "packed"

# 体积优先（按需手动指定）
[profile.release-small]
inherits = "release"
opt-level = "z"
