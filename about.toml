# Configuration for `cargo about generate` (see scripts/generate-licenses.sh).
# The accepted list covers every license used by the Rust dependencies that
# ship in Zephyr's distributed binaries. MPL-2.0 is file-level copyleft: the
# crates under it are used unmodified, and the generated notices file points
# back to each crate's source, which is how MPL-2.0 source availability is
# satisfied for an unmodified binary redistribution.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BlueOak-1.0.0",
    "MPL-2.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
